spring.application.name=spring4shell-spring-mvc
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/securecoding
spring.datasource.username=sc_user
spring.datasource.password=sc_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.access-secret=${JWT_ACCESS_SECRET}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000